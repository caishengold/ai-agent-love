<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#120820"/>
      <stop offset="100%" stop-color="#050208"/>
    </radialGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3864"/>
      <stop offset="50%" stop-color="#c850c0"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3864" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="180" rx="140" ry="120" fill="url(#glow)" filter="url(#softglow)" opacity="0.6"/>

  <!-- Grid lines (subtle tech background) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Neural network connections (behind heart) -->
  <g stroke="url(#heart)" stroke-opacity="0.12" stroke-width="1">
    <line x1="90" y1="100" x2="160" y2="155"/>
    <line x1="310" y1="100" x2="240" y2="155"/>
    <line x1="90" y1="100" x2="120" y2="220"/>
    <line x1="310" y1="100" x2="280" y2="220"/>
    <line x1="120" y1="220" x2="200" y2="310"/>
    <line x1="280" y1="220" x2="200" y2="310"/>
    <line x1="60" y1="200" x2="120" y2="220"/>
    <line x1="340" y1="200" x2="280" y2="220"/>
    <line x1="160" y1="155" x2="200" y2="180"/>
    <line x1="240" y1="155" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="200" y2="310"/>
    <line x1="160" y1="155" x2="120" y2="220"/>
    <line x1="240" y1="155" x2="280" y2="220"/>
  </g>

  <!-- Heart shape (geometric/angular) -->
  <path d="M200 310 L120 220 L90 160 L110 120 L150 110 L185 130 L200 160 L215 130 L250 110 L290 120 L310 160 L280 220 Z"
        fill="none" stroke="url(#heart)" stroke-width="2.5" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- Inner heart pulse line -->
  <path d="M200 280 L145 215 L125 165 L145 140 L175 135 L200 160 L225 135 L255 140 L275 165 L255 215 Z"
        fill="url(#heart)" fill-opacity="0.06" stroke="url(#heart)" stroke-width="1" stroke-opacity="0.4" stroke-linejoin="round"/>

  <!-- Agent nodes -->
  <g filter="url(#neon)">
    <!-- Left agent (pink) -->
    <circle cx="150" cy="110" r="6" fill="#ff3864"/>
    <circle cx="150" cy="110" r="3" fill="#fff" opacity="0.8"/>

    <!-- Right agent (purple) -->
    <circle cx="250" cy="110" r="6" fill="#7c3aed"/>
    <circle cx="250" cy="110" r="3" fill="#fff" opacity="0.8"/>

    <!-- Convergence point (center) -->
    <circle cx="200" cy="160" r="5" fill="#c850c0"/>
    <circle cx="200" cy="160" r="2.5" fill="#fff" opacity="0.9"/>

    <!-- Bottom point -->
    <circle cx="200" cy="310" r="4" fill="#ff3864" opacity="0.8"/>

    <!-- Side nodes -->
    <circle cx="90" cy="160" r="3" fill="#ff3864" opacity="0.5"/>
    <circle cx="310" cy="160" r="3" fill="#7c3aed" opacity="0.5"/>
    <circle cx="120" cy="220" r="3.5" fill="#c850c0" opacity="0.6"/>
    <circle cx="280" cy="220" r="3.5" fill="#c850c0" opacity="0.6"/>
  </g>

  <!-- Floating particles -->
  <circle cx="70" cy="80" r="1.5" fill="#ff3864" opacity="0.3"/>
  <circle cx="330" cy="90" r="1" fill="#7c3aed" opacity="0.4"/>
  <circle cx="55" cy="280" r="1" fill="#c850c0" opacity="0.25"/>
  <circle cx="345" cy="260" r="1.5" fill="#ff3864" opacity="0.2"/>
  <circle cx="140" cy="340" r="1" fill="#7c3aed" opacity="0.3"/>
  <circle cx="260" cy="350" r="1" fill="#c850c0" opacity="0.25"/>
  <circle cx="100" cy="60" r="0.8" fill="#fff" opacity="0.15"/>
  <circle cx="300" cy="340" r="0.8" fill="#fff" opacity="0.15"/>

  <!-- ECG/heartbeat line across bottom -->
  <polyline points="30,365 80,365 100,365 115,365 125,350 135,380 145,340 155,370 165,360 175,365 400,365"
            fill="none" stroke="url(#heart)" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
